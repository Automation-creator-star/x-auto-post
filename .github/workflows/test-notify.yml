name: Test Chatwork Notify
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-notify.yml'
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification (self_unread)
        run: |
          curl -s -X POST "https://api.chatwork.com/v2/rooms/442787815/messages" \
            -H "X-ChatWorkToken: ${{ secrets.CHATWORK_API_TOKEN }}" \
            --data-urlencode "body=[info][title]X自動投稿: 未読テスト[/title]この通知が未読(1)として表示されればOKです。[/info]" \
            --data-urlencode "self_unread=1"
