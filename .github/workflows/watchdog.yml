name: Posting Watchdog

on:
  # Reliable trigger: a CCR task dispatches this near the end of each posting
  # window. The schedule below is only a backup (GitHub cron is unreliable).
    # Independent backup scheduler (CCR fires the same watchdog on its own
    # schedule). Runs mid + late in every window so a single skipped fire on
    # either scheduler never loses a slot. JST: 9:50 / 11:50 / 12:50 / 16:50 /
    # 21:50 / 22:50 / 23:50 = UTC 0:50 / 2:50 / 3:50 / 7:50 / 12:50 / 13:50 / 14:50.
  schedule:
    - cron: '50 0,2,3,7,10,11,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      force_slot:
        description: 'morning | noon | night (blank = auto by JST time)'
        required: false

permissions:
  contents: write

concurrency:
  group: posting-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install tweepy playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run watchdog (self-heal + alert)
        env:
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: "442787815"
        run: python scripts/watchdog.py

      - name: Commit any generated/posted changes
        run: |
          git config user.name "watchdog bot"
          git config user.email "watchdog@users.noreply.github.com"
          git add -A queue posted card/specs
          if ! git diff --cached --quiet; then
            git commit -m "watchdog self-heal [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
