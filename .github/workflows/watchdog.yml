name: Posting Watchdog

on:
  # Backup scheduler (a CCR task also dispatches this). Runs at each window's
  # end. The job below does a CHEAP pre-check first and only installs Chromium /
  # generates when a slot is actually missing, so normal runs cost ~20s.
  schedule:
    # JST 11:40 / 17:40 / 20:40 / 23:40 = UTC 02:40 / 08:40 / 11:40 / 14:40
    - cron: '40 2,8,11,14 * * *'
  workflow_dispatch:
    inputs:
      force_slot:
        description: 'morning | noon | evening | night (blank = auto by JST time)'
        required: false

permissions:
  contents: write

concurrency:
  group: posting-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cheap gate: is the current slot already posted? If so, skip everything.
      - name: Pre-check
        id: chk
        env:
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
        run: |
          python - <<'PY'
          import os, datetime
          JST = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(JST); h = now.hour
          def slot(h):
              if 8 <= h <= 11: return "morning"
              if 12 <= h <= 17: return "noon"
              if 18 <= h <= 20: return "evening"
              if 21 <= h <= 23: return "night"
              return ""
          s = os.environ.get("FORCE_SLOT") or slot(h)
          need = "0"
          if s and not os.path.exists(f"posted/{now:%Y-%m-%d}-{s}.txt"):
              need = "1"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"need={need}\n")
          print(f"slot={s} need={need}")
          PY

      - name: Install dependencies
        if: steps.chk.outputs.need == '1'
        run: |
          pip install tweepy playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run watchdog (self-heal + alert)
        if: steps.chk.outputs.need == '1'
        env:
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: "442787815"
        run: python scripts/watchdog.py

      - name: Commit any generated/posted changes
        if: steps.chk.outputs.need == '1'
        run: |
          git config user.name "watchdog bot"
          git config user.email "watchdog@users.noreply.github.com"
          git add -A queue posted card/specs
          if ! git diff --cached --quiet; then
            git commit -m "watchdog self-heal [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
