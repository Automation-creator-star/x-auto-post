name: Post to X

on:
  # Primary trigger: a push to main. Reliable CCR "poke" scheduled tasks push an
  # empty commit at each posting time (see ScheduleWakeup/create_trigger), which
  # fires this workflow. scripts/post.py only posts if the current JST time is in
  # a slot window AND that slot's queue file exists; otherwise it exits cleanly.
  # Archive commits carry [skip ci] so they never re-trigger a run.
  push:
    branches: [main]
  schedule:
    # Backup trigger. GitHub cron is unreliable (delays/skips), so it only serves
    # as a safety net. Fires every ~20 min across the (widened) posting windows.
    # morning 08-11 JST = 23,0,1,2 UTC / noon 12-17 JST = 3,4,5,6,7,8 UTC /
    # night 21-23 JST = 12,13,14 UTC
    - cron: '3,23,43 23,0,1,2,3,4,5,6,7,8,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      force_slot:
        description: 'Slot to post now (morning/noon/night); leave empty to auto-detect'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy

      - name: Post queued tweet
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: "442787815"
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
        run: python scripts/post.py

      - name: Commit queue changes
        run: |
          git config user.name "x-auto-post bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue posted
          git diff --cached --quiet || git commit -m "archive posted tweet [skip ci]"
          git push
