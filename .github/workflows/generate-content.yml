name: Generate Daily Content

on:
  schedule:
    # JST 05:00 = UTC 20:00 (previous day). Fills any missing morning/night
    # content for the next 7 days, so it self-heals if a day is ever missed.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate morning + night content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_weekly.py

      - name: Commit generated content
        run: |
          git config user.name "content bot"
          git config user.email "content@users.noreply.github.com"
          git add -A queue card/specs
          if ! git diff --cached --quiet; then
            git commit -m "morning + night content (AI) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
