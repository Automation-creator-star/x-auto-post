name: Generate Noon News

on:
  schedule:
    # JST 11:00 = UTC 02:00 (before the noon posting window 12-17 JST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate news post + card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_news.py

      - name: Commit generated content
        run: |
          git config user.name "news bot"
          git config user.email "news@users.noreply.github.com"
          git add -A queue card/specs
          if ! git diff --cached --quiet; then
            git commit -m "noon news + card (AI) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
